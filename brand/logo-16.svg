<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <title>Goo Account Router (16px toolbar variant)</title>
  <!-- Pixel-grid simplification of logo.svg: curves become a square spine
       so every stroke lands on whole pixels. Use only at 16 px (and 2x = 32 px if needed). -->
  <rect width="16" height="16" rx="3" fill="#1f4099"/>
  <g fill="#fff" shape-rendering="crispEdges">
    <rect x="5" y="7" width="3" height="2"/>   <!-- stem -->
    <rect x="7" y="3" width="2" height="10"/>  <!-- spine -->
    <rect x="8" y="7" width="6" height="2"/>   <!-- lane 2 -->
    <rect x="8" y="11" width="6" height="2"/>  <!-- lane 3 -->
    <rect x="8" y="3" width="1" height="2"/>   <!-- lane 1 joint -->
  </g>
  <rect x="2" y="6" width="4" height="4" rx="1.5" fill="#fff"/>     <!-- input -->
  <rect x="9" y="2" width="5" height="4" rx="1.2" fill="#f97316"/> <!-- chosen lane -->
</svg>
